name: Veracode SCA Scan

on:
  push:
    branches:
      - "**"   # triggers on any branch push (any commit)

jobs:
  veracode-sca:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Veracode SCA
        env:
          SRCCLR_API_TOKEN: ${{ secrets.VERACODE_AGENT_TOKEN }}
          JAVA_OPTS: -Xms2g -Xmx4g
        uses: veracode/veracode-sca@v2.1.15
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create-issues: false
          recursive: true
          allow-dirty: true
          breakBuildOnPolicyFindings: true
          debug: true
      - name: Display scan URL
        run: |
          echo "View detailed report at: ${{ steps.veracode-sca.outputs.scan-url }}"




